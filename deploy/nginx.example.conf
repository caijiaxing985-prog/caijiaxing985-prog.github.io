# Add this to jianyoon.com's existing HTTPS server block.
# The trailing slash on proxy_pass removes /wenan before forwarding to the app.
client_max_body_size 16m;
location = /wenan {
    return 301 /wenan/;
}
location /wenan/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    proxy_cache off;
}
