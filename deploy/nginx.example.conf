# Add to the dedicated subdomain's existing HTTPS server block.
# Obtain its TLS certificate through the current panel / certificate manager.
# Use the whole subdomain, not a /wenan subdirectory.
client_max_body_size 16m;
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    proxy_cache off;
}
