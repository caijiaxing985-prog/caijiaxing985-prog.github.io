services:
  library:
    image: ${LIBRARY_IMAGE:-jianyoon-library:initial}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - library-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  library-data:
    name: jianyoon-library-data
